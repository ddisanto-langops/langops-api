services:
  core:
    build:
      context: .
      target: development
    ports:
      - "8000:8000"
    env_file:
      - /etc/langops-api/secrets.env
    restart: unless-stopped
    volumes:
      - .:/app
    environment:
      - WATCHFILES_FORCE_POLLING=true # make sure it hot-reloads on edits
    networks:
      - shared-network

  db-dev:
    image: cloudflare/cloudflared:latest
    environment:
      - TUNNEL_SERVICE_TOKEN_ID=${DB_CF_ACCESS_CLIENT_ID}
      - TUNNEL_SERVICE_TOKEN_SECRET=${DB_CF_ACCESS_CLIENT_SECRET}
    ports:
      - "5432:5432"
    command: > 
      access tcp --hostname db-dev.pcglangops.com
      --url 0.0.0.0:5432
    networks:
      - shared-network

# Using 0.0.0.0 so it listens on all interfaces, not just insinde its own container

networks:
  shared-network:
    external: true
    name: dev-bridge-network