services:
  api-dev:
    build:
      context: .
      target: development
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - .:/app
    environment:
      - WATCHFILES_FORCE_POLLING=true # make sure it hot-reloads on edits
    networks:
      - langops-network

  db-dev:
    image: cloudflare/cloudflared:latest
    env_file:
      - .env
    command: > 
      access tcp --hostname db-dev.pcglangops.com
      --url 0.0.0.0:5432
      --header "CF-Access-Client-Id: ${DB_CF_ACCESS_CLIENT_ID}"
      --header "CF-Access-Client-Secret: ${DB_CF_ACCESS_CLIENT_SECRET}"
    networks:
      - langops-network


  # ----------------------------------------------------
  # PGAdmin
  # ----------------------------------------------------
  pg-admin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin-dev
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_USERNAME}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PSWD}
    ports:
      - "9050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - db-dev
    networks:
      - langops-network

networks:
  langops-network:
    external: true
    name: langops-network

volumes:
  pgadmin-data:
